services:
  db:
    image: mariadb:11.6
    container_name: at-gateway-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: at_gateway
      MYSQL_USER: atgw
      MYSQL_PASSWORD: atgw
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: at-gateway-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: atgw
      DB_PASSWORD: atgw
      DB_NAME: at_gateway
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too-in-production-32ch}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      MODEM_AUTO_DETECT: ${MODEM_AUTO_DETECT:-true}
      MODEM_PORT: ${MODEM_PORT:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-piper}
      STT_PROVIDER: ${STT_PROVIDER:-whisper-cpp}
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
      # USB device passthrough - adjust based on your system
      # - /dev/ttyUSB2:/dev/ttyUSB2
    devices:
      # Auto-detect USB serial devices
      - /dev/bus/usb:/dev/bus/usb
    privileged: false
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: at-gateway-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
